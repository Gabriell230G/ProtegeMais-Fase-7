# =============================================================================
# Protege+ | Fase 7, Parte 2: proxy reverso na borda da rede (DMZ)
# =============================================================================
# Unico ponto exposto a internet. A API e o banco ficam em redes internas e
# so recebem conexao vinda daqui.
#
# Este arquivo entra no bloco http {} do nginx.conf, que precisa definir:
#   upstream protege_api { server <api>:8080; }       (endereco da API)
#   map "" $protege_raiz { default /caminho/do/site; } (pasta do front-end)
# O roteiro infra/testar-rede.sh gera esse nginx.conf e testa tudo.
#
# A API roda atras deste proxy com duas variaveis de ambiente:
#   PROTEGE_PROXY_CONFIAVEL=true  limite por origem e trilha de auditoria usam
#                                 o IP do cidadao, e nao o do proxy
#   CORS_ORIGENS=https://<dominio> o navegador manda a origem publica no login;
#                                 sem ela na lista, a API recusa com 403
# =============================================================================

server_tokens off;                       # nao anuncia a versao do nginx

# ---------- Disponibilidade: limites na borda --------------------------------
# A API ja tem limites proprios (RateLimitFilter). Repetir aqui barra o abuso
# antes de ocupar uma thread da aplicacao: em um ataque de volume, quem cai e
# o proxy, que e barato de replicar, e nao a API.
map $request_method $origem_post { POST $binary_remote_addr; default ""; }

limit_req_zone $origem_post        zone=denuncia:10m rate=6r/m;
limit_req_zone $origem_post        zone=login:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;
limit_req_status  429;
limit_conn_status 429;

# Conexao lenta de proposito (slowloris) e derrubada em 10 s.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     15s;

# ---------- HTTP: so redireciona ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name protege.local localhost;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS ------------------------------------------------------------
server {
    # "listen ... http2" funciona do nginx 1.18 ao atual (o 1.25 em diante
    # prefere a diretiva "http2 on", mas ainda aceita esta forma).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name protege.local localhost;

    # Confidencialidade e integridade em transito. Em producao, certificado de
    # AC publica ou ICP-Brasil; aqui, o da AC interna de infra/pki.
    ssl_certificate      certs/servidor.crt;
    ssl_certificate_key  certs/servidor.key;
    ssl_protocols        TLSv1.2 TLSv1.3;    # SSL 3, TLS 1.0 e 1.1 recusados
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:TLS:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;                # sigilo futuro (forward secrecy) de verdade

    # Aparelhos de campo apresentam certificado proprio (TLS mutuo). O pedido
    # e opcional aqui e obrigatorio nas rotas dos aparelhos, mais abaixo.
    ssl_client_certificate certs/ac-dispositivos.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       1;

    # ---------- Cabecalhos de seguranca ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    # O painel usa onclick no HTML e o formulario React compila no navegador,
    # dai 'unsafe-inline' e 'unsafe-eval'. A politica ainda limita DE ONDE vem
    # cada recurso, bloqueia plugins e impede o site de ser embutido em outro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://vlibras.gov.br https://*.vlibras.gov.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com https://vlibras.gov.br https://*.vlibras.gov.br; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://api.qrserver.com https://vlibras.gov.br https://*.vlibras.gov.br; connect-src 'self' https://servicodados.ibge.gov.br https://nominatim.openstreetmap.org https://vlibras.gov.br https://*.vlibras.gov.br; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    limit_conn conexoes 30;
    client_max_body_size 300k;               # a API recusa JSON acima de 256 KB

    # ---------- Respostas da propria borda, em JSON ----------
    error_page 429 = @limite;
    error_page 502 503 504 = @indisponivel;
    error_page 495 496 = @sem_certificado;

    location @limite {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"erro":"Muitas requisicoes desta origem. Tente de novo em um minuto.","origem":"proxy"}';
    }
    location @indisponivel {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"erro":"Servico temporariamente indisponivel. Em emergencia ligue 190 ou 180.","origem":"proxy"}';
    }
    location @sem_certificado {
        default_type application/json;
        return 403 '{"erro":"Aparelho sem certificado valido da AC de dispositivos.","origem":"proxy"}';
    }

    # ---------- Front-end: so o que e publico ----------
    # Lista do que pode sair. O resto do repositorio (backend, database,
    # seguranca, blockchain, .git) nunca e servido, nem por engano.
    root $protege_raiz;
    index index.html;

    location = /              { try_files /index.html =404; }
    # O simulador-iot.html fica de fora: e ferramenta de desenvolvimento, e
    # aparelho de verdade fala com a API com certificado, nao por pagina web.
    location ~ ^/(index|search|formulario-react)\.html$ { try_files $uri =404; }
    location ^~ /css/         { try_files $uri =404; }
    location ^~ /js/          { try_files $uri =404; }
    location ^~ /images/      { try_files $uri =404; }
    location /                { return 404; }

    # As paginas apontam para a API no mesmo endereco (/api), sem CORS.
    sub_filter '<head>' '<head><script>window.PROTEGE_API_URL="/api";</script>';
    sub_filter_once on;

    # ---------- API ----------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Substitui (nao acrescenta) o cabecalho: o valor mandado pelo cliente
    # e descartado aqui, e a API le so o endereco que este proxy viu.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Quem e o aparelho, pelo certificado (vazio para quem nao apresentou um).
    # Fica neste nivel de proposito: um proxy_set_header dentro de uma
    # location apaga todos os herdados daqui, inclusive o Host.
    proxy_set_header X-Dispositivo-Certificado $ssl_client_s_dn;
    proxy_connect_timeout 3s;                # API fora do ar: resposta em 3 s, nao em 60
    proxy_read_timeout    30s;               # a triagem por IA tem teto de 15 s
    proxy_next_upstream   error timeout;     # tenta a outra instancia, se houver
    proxy_intercept_errors off;

    location = /api/denuncias {
        limit_req zone=denuncia burst=2 nodelay;
        proxy_pass http://protege_api;
    }
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://protege_api;
    }
    # Evidencia ate 5 MB (a API confere o limite e o tipo pelo conteudo).
    location ~ ^/api/denuncias/protocolo/[^/]+/evidencias$ {
        client_max_body_size 6m;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://protege_api;
    }

    # Rotas dos aparelhos: TLS mutuo obrigatorio. Sem certificado da nossa AC,
    # a requisicao morre aqui e nem chega a API. A API ainda exige a chave
    # X-Device-Key: o aparelho precisa das duas coisas.
    location ~ ^/api/iot/(acionamento|telemetria|totem)$ {
        if ($ssl_client_verify != SUCCESS) { return 495; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://protege_api;
    }

    # Prefixo comum (sem ^~), para as regras de evidencia e de aparelhos,
    # escritas como expressao regular, valerem antes desta.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://protege_api;
    }

    # Console do H2 e documentacao da API nao saem para a internet.
    location ^~ /h2-console { return 404; }
    location ^~ /swagger-ui { return 404; }
    location ^~ /v3/api-docs { return 404; }
}
